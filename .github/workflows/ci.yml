name: Stock Prediction CI

on:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install Dependencies

      run: |
        python -m pip install --upgrade pip
        pip install pandas==2.2.3 numpy==2.2.6 scikit-learn==1.6.1 joblib==1.5.1
        pip install dvc==3.63.0 dvc-gs==3.0.2
        pip install mlflow==2.22.2
        pip install feast==0.65.0
        pip install gcsfs==2025.5.1 pyarrow==19.0.1 matplotlib==3.10.3 pytest==8.4.1

    - name: Install CML
      run: |
        npm install -g @dvcorg/cml

    - name: Pull DVC Data

      run: |

        dvc pull

    - name: Train Model

      run: |

        python train.py

    - name: MLflow Training

      run: |

        python mlflow_train.py

    - name: Evaluate

      run: |

        python evaluate.py

    - name: Run Tests

      run: |

        pytest

    - name: Generate Report

      run: |

        python report.py

    - name: CML Report

      env:

        REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      run: |

        cml comment create report.md
