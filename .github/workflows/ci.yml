name: Stock Prediction CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip

          pip install pandas==2.2.3 numpy==2.2.6 scikit-learn==1.6.1 joblib==1.5.1
          pip install dvc==3.58.0 dvc-gs==3.0.1
          pip install mlflow==2.22.2
          pip install feast==0.65.0
          pip install gcsfs==2025.5.1 pyarrow==19.0.1 matplotlib==3.10.3 pytest==8.4.1
          pip install pathspec==0.12.1

      - name: Install CML
        run: npm install -g @dvcorg/cml

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/58620345939/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@project-32301d32-7dfb-43f1-b1a.iam.gserviceaccount.com

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify Authentication
        run: |
          gcloud auth list
          gcloud storage ls gs://22f3001838_mlops_oppe1

      - name: Pull DVC Data
        run: dvc pull

      - name: Train Model
        run: python train.py

      - name: MLflow Training
        run: python mlflow_train.py

      - name: Evaluate Model
        run: python evaluate.py

      - name: Run Tests
        run: pytest

      - name: Generate Report
        run: python report.py

      - name: Publish CML Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cml comment create report.md
