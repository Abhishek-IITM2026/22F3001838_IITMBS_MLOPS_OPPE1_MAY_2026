name: Stock Prediction CI

on:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4

    - name: Setup Python

      uses: actions/setup-python@v5

      with:

        python-version: "3.12"

    - name: Install Dependencies

      run: |

        pip install -r requirements.txt

    - name: Pull DVC Data

      run: |

        dvc pull

    - name: Train Model

      run: |

        python train.py

    - name: MLflow Training

      run: |

        python mlflow_train.py

    - name: Evaluate

      run: |

        python evaluate.py

    - name: Run Tests

      run: |

        pytest

    - name: Generate Report

      run: |

        python report.py

    - name: CML Report

      env:

        REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      run: |

        cml comment create report.md
